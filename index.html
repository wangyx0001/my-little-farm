<meta name="apple-mobile-web-app-title" content="My Little Farm">

<title>My Little Farm</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { overscroll-behavior:none; background:#3aa2dd;
    font-family:"Comic Sans MS","Chalkboard SE","Segoe UI Rounded","Segoe UI",sans-serif;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  /* Everything lives in #stage, whose pixel size JS sets explicitly. iOS Safari
     reports a layout viewport that disappears behind its toolbars, so a CSS
     height of 100% would be wrong — JS sizes #stage off visualViewport instead. */
  html, body { height:100%; overflow:hidden; }
  #stage { position:fixed; top:0; left:0; overflow:hidden; touch-action:none; margin:0 auto; }
  #game { position:absolute; inset:0; display:block; }
  /* ---------- HUD ---------- */
  #hud { position:absolute; inset:0; pointer-events:none; z-index:5; }
  .pill { background:rgba(255,255,255,0.92); border-radius:999px; padding:6px 14px;
    box-shadow:0 3px 0 rgba(0,0,0,0.12); font-weight:bold; color:#6b4a1e; font-size:17px;
    display:flex; align-items:center; gap:7px; }
  #titlePill { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:calc(10px + env(safe-area-inset-left)); }
  #rightHud { position:absolute; top:calc(10px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right));
    display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  #coinPill { font-size:20px; }
  #coinPill .coinIcon { width:22px; height:22px; border-radius:50%; flex:0 0 auto;
    background:radial-gradient(circle at 35% 30%, #ffe98a, #ffc93c 55%, #e8a417);
    border:2px solid #d68f10; box-shadow:inset 0 -2px 0 rgba(0,0,0,0.15); }
  #coinPill.bump { animation:bump 0.25s ease; }
  @keyframes bump { 40% { transform:scale(1.18); } }
  #bagPill { font-size:15px; }
  #bagPill.full { background:#ffd9d9; color:#c0392b; animation:pulse 0.8s ease infinite; }
  @keyframes pulse { 50% { transform:scale(1.08); } }
  #muteBtn { position:absolute; top:calc(56px + env(safe-area-inset-top)); left:calc(10px + env(safe-area-inset-left));
    pointer-events:auto; width:44px; height:44px; border-radius:50%; border:none; font-size:20px;
    background:rgba(255,255,255,0.92); box-shadow:0 3px 0 rgba(0,0,0,0.12); cursor:pointer; }
  #muteBtn:active { transform:scale(0.92); }
  /* ---------- Name overlay ---------- */
  #nameOverlay { position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, rgba(87,199,240,0.75), rgba(58,169,224,0.85)); backdrop-filter:blur(3px);
    transition:opacity 0.4s ease; padding:20px; }
  #nameOverlay.hidden { opacity:0; pointer-events:none; }
  #nameOverlay .panel { background:linear-gradient(180deg,#fffbe8,#ffeeba); border-radius:28px; padding:28px 26px;
    text-align:center; box-shadow:0 10px 0 rgba(0,0,0,0.15), 0 20px 60px rgba(0,0,0,0.25);
    max-width:340px; width:100%; border:4px solid #fff; }
  #nameOverlay .big { font-size:44px; letter-spacing:4px; }
  #nameOverlay h1 { color:#7a4a1e; font-size:24px; margin:10px 0 4px; }
  #nameOverlay p { color:#9a6b35; font-size:17px; margin-bottom:14px; }
  #nameInput { width:100%; font-size:22px; text-align:center; padding:10px; border-radius:16px;
    border:3px solid #e8b866; outline:none; font-family:inherit; color:#6b4a1e; background:#fff; }
  #nameInput:focus { border-color:#6bbf3a; }
  #startBtn { margin-top:16px; width:100%; font-size:22px; font-weight:bold; font-family:inherit; color:#fff;
    background:linear-gradient(180deg,#8ed04d,#5cae2a); border:none; border-radius:18px; padding:13px;
    box-shadow:0 5px 0 #3f8618; cursor:pointer; }
  #startBtn:active { transform:translateY(3px); box-shadow:0 2px 0 #3f8618; }
</style>

<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="titlePill" class="pill">🌻 <span id="farmName">My Little Farm</span></div>
    <button id="muteBtn">🔊</button>
    <div id="rightHud">
      <div id="coinPill" class="pill"><span class="coinIcon"></span><span id="coinCount">0</span></div>
      <div id="bagPill" class="pill">🧺 <span id="bagCount">0/8</span></div>
    </div>
  </div>
  <div id="nameOverlay" class="hidden">
    <div class="panel">
      <div class="big">🐔🌾🐮</div>
      <h1>Welcome to your new farm!</h1>
      <p>What's your name, farmer?</p>
      <input id="nameInput" maxlength="14" placeholder="Your name" autocomplete="off">
      <button id="startBtn">Let's farm! 🌻</button>
    </div>
  </div>
</div>
<script>
'use strict';
/* ================================================================
   MY LITTLE FARM — a Farm Land–style island farm game
   Single file, no dependencies. Art drawn on Canvas 2D.
   ================================================================ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

const canvas = document.getElementById('game');
const stage = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let cssW = 0, cssH = 0, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  // visualViewport excludes the iOS Safari toolbars; innerHeight does not.
  const vv = window.visualViewport;
  const w = Math.round((vv && vv.width) || window.innerWidth || 360);
  const h = Math.round((vv && vv.height) || window.innerHeight || 640);
  if (w === cssW && h === cssH) return;
  cssW = w; cssH = h;
  stage.style.width = w + 'px';
  stage.style.height = h + 'px';
  // The canvas needs an explicit CSS size: browsers otherwise lay it out at its
  // width/height *attribute* size, which is dpr times too big and overflows.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
}
// Called directly rather than coalesced through requestAnimationFrame: resize()
// is cheap (it early-returns when nothing moved), and this avoids a queued-flag
// that could latch on and freeze the game at the wrong size if rAF is throttled.
function queueResize() { resize(); }
window.addEventListener('resize', queueResize);
window.addEventListener('orientationchange', queueResize);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', queueResize);
  window.visualViewport.addEventListener('scroll', queueResize);
}
if (window.ResizeObserver) {
  const ro = new ResizeObserver(queueResize);
  ro.observe(document.documentElement);
  if (document.body) ro.observe(document.body);
}
resize();

/* ---------------- Audio (all sounds synthesized) ---------------- */
const AU = {
  ctx: null, muted: false,
  unlocked: false,
  init() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (!this.ctx) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    // iOS keeps the context muted until a buffer is started inside a gesture.
    if (!this.unlocked) {
      this.unlocked = true;
      try {
        const src = this.ctx.createBufferSource();
        src.buffer = this.ctx.createBuffer(1, 1, 22050);
        src.connect(this.ctx.destination);
        src.start(0);
      } catch (e) {}
    }
  },
  tone(o) {
    if (!this.ctx || this.muted) return;
    const { f = 440, f2 = 0, type = 'sine', dur = 0.15, vol = 0.2, delay = 0 } = o;
    const t0 = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f, t0);
    if (f2) osc.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(this.ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  },
  noise(o) {
    if (!this.ctx || this.muted) return;
    const { dur = 0.1, vol = 0.15, f = 1200, delay = 0 } = o;
    const t0 = this.ctx.currentTime + delay;
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 0.8;
    const g = this.ctx.createGain(); g.gain.value = vol;
    src.connect(bp).connect(g).connect(this.ctx.destination);
    src.start(t0);
  },
  coin()   { this.tone({ f: 987, f2: 1319, dur: 0.09, vol: 0.10 }); this.tone({ f: 1319, f2: 1976, dur: 0.15, vol: 0.09, delay: 0.06 }); },
  pop(p)   { p = p || 1; this.tone({ f: 400 * p, f2: 820 * p, type: 'triangle', dur: 0.09, vol: 0.13 }); },
  chop()   { this.noise({ dur: 0.07, vol: 0.32, f: 700 }); this.tone({ f: 150, f2: 80, type: 'square', dur: 0.08, vol: 0.09 }); },
  thud()   { this.tone({ f: 240, f2: 170, dur: 0.14, vol: 0.14 }); this.tone({ f: 190, f2: 130, dur: 0.16, vol: 0.11, delay: 0.13 }); },
  tick()   { this.tone({ f: 720, f2: 950, dur: 0.045, vol: 0.05 }); },
  chirp()  { const b = rand(1700, 2600); this.tone({ f: b, f2: b * 1.4, dur: 0.07, vol: 0.03 }); this.tone({ f: b * 1.1, f2: b * 0.85, dur: 0.09, vol: 0.025, delay: 0.1 }); },
  moo()    { this.tone({ f: 180, f2: 140, type: 'sawtooth', dur: 0.4, vol: 0.04 }); },
  cluck()  { this.tone({ f: 520, f2: 380, type: 'square', dur: 0.06, vol: 0.03 }); },
  meow()   { this.tone({ f: 660, f2: 900, type: 'sine', dur: 0.12, vol: 0.05 }); this.tone({ f: 880, f2: 540, type: 'sine', dur: 0.2, vol: 0.05, delay: 0.1 }); },
  splash() { this.noise({ dur: 0.18, vol: 0.12, f: 900 }); this.tone({ f: 520, f2: 920, type: 'sine', dur: 0.12, vol: 0.04 }); },
  fanfare(){ [523, 659, 784, 1047].forEach((f, i) => { this.tone({ f, type: 'triangle', dur: 0.24, vol: 0.15, delay: i * 0.1 }); this.tone({ f: f * 2, type: 'sine', dur: 0.2, vol: 0.05, delay: i * 0.1 }); }); },
};

const SAVE_KEY = 'myLittleFarm.v1';
function save() {
  if (!started) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 1, name: S.name, coins: S.coins, muted: AU.muted,
      carried: S.carried, un: S.un, paid: S.paid, soldOnce: S.soldOnce,
    }));

}
function load() {
  try {
    if (location.search.indexOf('reset') >= 0) { localStorage.removeItem(SAVE_KEY); return false; }

    if (!raw) return false;
    const d = JSON.parse(raw);

    S.carried = Array.isArray(d.carried) ? d.carried.slice(0, 40) : [];

function addTree(p) { trees.push({ x: p.x, y: p.y, hp: 3, wob: 0, regrow: 0, spawnT: 0, seed: Math.random() * TAU }); }

function buildWorld() {

function walkableRects() {
  const r = [MAIN, FOREST, DOCK];
  if (S.un.bridge) r.push(BRIDGE);
  return r;
}
function isWalkable(x, y) {
  const m = 20;
  for (const r of walkableRects())
    if (x > r.x + m && x < r.x + r.w - m && y > r.y + m && y < r.y + r.h - m) return true;
  return false;
}

/* ---------------- Input ---------------- */
const joy = { active: false, id: -1, sx: 0, sy: 0, dx: 0, dy: 0 };
const keys = {};
// Pointer positions must be canvas-local: the stage is centered on very wide
// screens, and sits below the host header when embedded.
function localPt(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { x: clientX - r.left, y: clientY - r.top };
}
function joyStart(id, clientX, clientY) {
  AU.init();
  if (!started || joy.active) return;
  const p = localPt(clientX, clientY);
  joy.active = true; joy.id = id;
  joy.sx = p.x; joy.sy = p.y; joy.dx = 0; joy.dy = 0;
}
function joyMove(id, clientX, clientY) {
  if (!joy.active || id !== joy.id) return;
  const R = 58;
  const p = localPt(clientX, clientY);
  let dx = p.x - joy.sx, dy = p.y - joy.sy;
  const d = Math.hypot(dx, dy);
  if (d > R) {
    // drag the joystick base along so steering stays comfy on long swipes
    joy.sx += dx / d * (d - R); joy.sy += dy / d * (d - R);
    dx = dx / d * R; dy = dy / d * R;
  }
  joy.dx = dx; joy.dy = dy;
}
function joyStop(id) { if (joy.active && id === joy.id) { joy.active = false; joy.dx = joy.dy = 0; } }

if (window.PointerEvent) {
  canvas.addEventListener('pointerdown', e => {
    joyStart(e.pointerId, e.clientX, e.clientY);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', e => joyMove(e.pointerId, e.clientX, e.clientY));
  canvas.addEventListener('pointerup', e => joyStop(e.pointerId));
  canvas.addEventListener('pointercancel', e => joyStop(e.pointerId));
} else { // older iOS Safari
  canvas.addEventListener('touchstart', e => {
    const t = e.changedTouches[0]; joyStart(t.identifier, t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) joyMove(t.identifier, t.clientX, t.clientY);
  }, { passive: true });
  const endTouch = e => { for (const t of e.changedTouches) joyStop(t.identifier); };
  canvas.addEventListener('touchend', endTouch, { passive: true });
  canvas.addEventListener('touchcancel', endTouch, { passive: true });
}
// iOS ignores touch-action in some embedded contexts; belt and braces.
canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

function inputVector() {
  if (joy.active) {
    const d = Math.hypot(joy.dx, joy.dy);
    if (d < 8) return { x: 0, y: 0 };
    const m = clamp((d - 8) / 40, 0, 1);
    return { x: joy.dx / d * m, y: joy.dy / d * m };
  }
  let x = 0, y = 0;
  if (keys.arrowleft || keys.a) x -= 1;
  if (keys.arrowright || keys.d) x += 1;
  if (keys.arrowup || keys.w) y -= 1;
  if (keys.arrowdown || keys.s) y += 1;
  const d = Math.hypot(x, y);
  return d ? { x: x / d, y: y / d } : { x: 0, y: 0 };
}

/* ---------------- Helpers: fx ---------------- */
function floater(x, y, txt, col, size) {

}
function confetti(x, y) {
  const cols = ['#ff6b81', '#ffd93d', '#6bcB77', '#4d96ff', '#ff9f45', '#c780fa'];
  for (let i = 0; i < 36; i++) {
    const a = rand(0, TAU), sp = rand(60, 260);
    parts.push({ x, y: y - 10, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 140,
      col: pick(cols), t: 0, life: rand(0.7, 1.3), r: rand(3, 6), rot: rand(0, TAU), vr: rand(-8, 8) });
  }
}
function puff(x, y, col, n) {
  for (let i = 0; i < (n || 6); i++) {
    const a = rand(0, TAU), sp = rand(20, 80);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
      col: col || '#ffffff', t: 0, life: rand(0.3, 0.6), r: rand(2, 4), rot: 0, vr: 0 });
  }
}
function freeSlots() { return cap() - S.carried.length - reserved; }
function collectItem(type, x, y) {
  reserved++;
  flyers.push({ type, x, y, t: 0, mode: 'stack', sx: x, sy: y });
  AU.pop(rand(0.9, 1.2));
}
function fullHint() {
  if (fullHintT > 0) return;
  fullHintT = 2.6;
  floater(S.player.x, S.player.y - 78, 'Basket full! Go sell! 🧺', '#ffe08a', 19);
  AU.thud();
}

/* ---------------- Update ---------------- */
let time = 0;
function update(dt) {
  time += dt;
  dayT = (dayT + dt / DAY_LEN) % 1;
  const P = S.player;

  /* --- movement --- */
  const iv = started ? inputVector() : { x: 0, y: 0 };
  const sp = speed();
  P.vx = iv.x * sp; P.vy = iv.y * sp;
  P.moving = (iv.x !== 0 || iv.y !== 0);
  if (P.moving) {
    let nx = P.x + P.vx * dt, ny = P.y + P.vy * dt;
    if (isWalkable(nx, ny)) { P.x = nx; P.y = ny; }
    else if (isWalkable(nx, P.y)) { P.x = nx; }
    else if (isWalkable(P.x, ny)) { P.y = ny; }
    if (Math.abs(P.vx) > 10) P.flip = P.vx < 0;
    P.walkPhase += dt * 13;
  } else P.walkPhase = 0;
  P.lean = lerp(P.lean, clamp(P.vx * 0.0022, -0.3, 0.3), dt * 8);
  P.blink -= dt; if (P.blink < -3) P.blink = rand(0.1, 0.18);

  /* --- pet cat trots after the farmer --- */
  {
    const c = cat;
    const tx = P.x - (P.flip ? -30 : 30), ty = P.y + 14;
    const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy);
    if (d > 320) { c.x = tx; c.y = ty; }   // catch up if left far behind (e.g. across the bridge)
    else if (d > 8) {
      const spd = clamp(d * 3.2, 0, speed() * 1.5);
      const nx = c.x + dx / d * spd * dt, ny = c.y + dy / d * spd * dt;
      if (isWalkable(nx, ny)) { c.x = nx; c.y = ny; }
      else if (isWalkable(nx, c.y)) c.x = nx;
      else if (isWalkable(c.x, ny)) c.y = ny;
      if (Math.abs(dx) > 4) c.flip = dx < 0;
    }
    c.moving = d > 22;
    if (c.moving) { c.walkPhase += dt * 12; c.sit = Math.max(0, c.sit - dt * 4); }
    else { c.walkPhase = 0; c.sit = Math.min(1, c.sit + dt * 2); }
    c.tail += dt * (c.moving ? 6 : 2.2);
    c.blink -= dt; if (c.blink < -3) c.blink = rand(0.1, 0.18);
    c.meowT -= dt;
    if (c.meowT <= 0) { c.meowT = rand(9, 18); if (started && !c.moving) { AU.meow(); floater(c.x, c.y - 26, '♪', '#ffd0e0', 15); } }
  }

  /* --- trees: chopping --- */
  P.chopping = false;
  let tgt = null, best = 1e9;
  for (const t of trees) {
    if (t.hp <= 0) {
      t.regrow -= dt;
      if (t.regrow <= 0) { t.hp = 3; t.spawnT = 0.001; puff(t.x, t.y - 30, '#a5e06b', 8); }
      continue;
    }
    if (t.spawnT > 0 && t.spawnT < 0.4) t.spawnT += dt;
    const d = dist(P.x, P.y, t.x, t.y);
    if (d < 74 && d < best) { best = d; tgt = t; }
    t.wob = Math.max(0, t.wob - dt * 3);
  }
  if (tgt && started) {
    if (freeSlots() >= 1) {
      P.chopping = true;
      if (!P.moving) P.flip = tgt.x < P.x;
      P.chopT += dt;
      const CHOP = S.un.gold ? 0.38 : 0.62;
      if (P.chopT >= CHOP) {
        P.chopT = 0;
        tgt.hp--; tgt.wob = 1;
        AU.chop();
        puff(tgt.x + rand(-10, 10), tgt.y - rand(30, 55), '#c9e8a0', 4);
        collectItem('wood', tgt.x + rand(-8, 8), tgt.y - 30);
        if (tgt.hp <= 0) { tgt.regrow = 22; puff(tgt.x, tgt.y - 20, '#e8d5a0', 10); }
      }
    } else { P.chopT = 0; fullHint(); }
  } else P.chopT = 0;

  /* --- wheat plots --- */
  for (const pl of plots) {
    if (pl.spawnT > 0 && pl.spawnT < 0.5) pl.spawnT += dt;
    if (pl.growth < 1) pl.growth = Math.min(1, pl.growth + dt / 11);
    else if (started && Math.abs(P.x - pl.x) < PLOT_SIZE.w / 2 + 8 && Math.abs(P.y - pl.y) < PLOT_SIZE.h / 2 + 10) {
      const want = 3 + (S.un.gold ? 1 : 0);
      const n = Math.min(want, freeSlots());
      if (n <= 0) { fullHint(); continue; }
      pl.growth = 0;
      for (let i = 0; i < n; i++) {
        const tf = pl.tufts[i % pl.tufts.length];
        collectItem('wheat', pl.x + tf.dx, pl.y + tf.dy - 10);
      }
      floater(pl.x, pl.y - 30, '🌾', '#ffe08a', 22);
    }
  }

  /* --- berry bushes --- */
  for (const b of bushes) {
    if (b.spawnT > 0 && b.spawnT < 0.5) b.spawnT += dt;
    if (b.growth < 1) b.growth = Math.min(1, b.growth + dt / 14);
    else if (started && dist(P.x, P.y, b.x, b.y) < 46) {
      const want = 2 + (S.un.gold ? 1 : 0);
      const n = Math.min(want, freeSlots());
      if (n <= 0) { fullHint(); continue; }
      b.growth = 0;
      for (let i = 0; i < n; i++) collectItem('berry', b.x + rand(-14, 14), b.y - rand(10, 26));
      puff(b.x, b.y - 16, '#ff8aa0', 5);
    }
  }

  /* --- chickens --- */
  const eggsOnGround = drops.filter(d => d.type === 'egg').length;
  for (const c of chickens) {
    if (c.spawnT > 0 && c.spawnT < 0.5) c.spawnT += dt;
    c.moveT -= dt;
    if (c.moveT <= 0) {
      c.moveT = rand(1.5, 4);
      c.tx = rand(CHICKEN_PEN.x + 25, CHICKEN_PEN.x + CHICKEN_PEN.w - 25);
      c.ty = rand(CHICKEN_PEN.y + 35, CHICKEN_PEN.y + CHICKEN_PEN.h - 20);
    }
    const dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy);
    if (d > 4) {
      c.x += dx / d * 26 * dt; c.y += dy / d * 26 * dt;
      c.flip = dx < 0; c.hop += dt * 10;
    }
    c.peckT -= dt; if (c.peckT < -0.6) c.peckT = rand(1.5, 4);
    c.layT -= dt;
    if (c.layT <= 0) {
      c.layT = rand(7, 13);
      if (eggsOnGround < 4) {
        drops.push({ type: 'egg', x: clamp(c.x - 12, CHICKEN_PEN.x + 15, CHICKEN_PEN.x + CHICKEN_PEN.w - 15),
                     y: clamp(c.y + 6, CHICKEN_PEN.y + 25, CHICKEN_PEN.y + CHICKEN_PEN.h - 10),
                     bob: Math.random() * TAU, taken: false });
        c.hop = 0; AU.cluck();
        puff(c.x, c.y - 8, '#fff', 3);
      }
    }
  }

  /* --- cows --- */
  const milkOnGround = drops.filter(d => d.type === 'milk').length;
  for (const c of cows) {
    if (c.spawnT > 0 && c.spawnT < 0.5) c.spawnT += dt;
    c.moveT -= dt;
    if (c.moveT <= 0) {
      c.moveT = rand(2.5, 6);
      c.tx = rand(COW_PEN.x + 45, COW_PEN.x + COW_PEN.w - 45);
      c.ty = rand(COW_PEN.y + 55, COW_PEN.y + COW_PEN.h - 30);
    }
    const dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy);
    if (d > 5) { c.x += dx / d * 18 * dt; c.y += dy / d * 18 * dt; c.flip = dx < 0; }
    c.milkT -= dt;
    if (c.milkT <= 0) {
      c.milkT = rand(14, 22);
      if (milkOnGround < 3) {
        drops.push({ type: 'milk', x: c.x + rand(-10, 10), y: c.y + 12, bob: Math.random() * TAU, taken: false });
        AU.moo();
      }
    }
  }

  /* --- pick up drops (magnet) --- */
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    if (started && !d.taken && dist(P.x, P.y, d.x, d.y) < 36) {
      if (freeSlots() >= 1) { d.taken = true; collectItem(d.type, d.x, d.y); drops.splice(i, 1); }
      else fullHint();
    }
  }

  /* --- flyers (items arcing to basket / sell stand) --- */
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i];
    f.t += dt / 0.45;
    if (f.mode === 'stack') {
      const tx = P.x - (P.flip ? -13 : 13), ty = P.y - 42 - Math.min(S.carried.length, 10) * 5;
      const t = Math.min(f.t, 1);
      f.x = lerp(f.sx, tx, t); f.y = lerp(f.sy, ty, t) - Math.sin(t * Math.PI) * 46;
      if (f.t >= 1) {
        flyers.splice(i, 1); reserved--;
        if (S.carried.length < cap()) S.carried.push(f.type);
        dirty = true;
      }
    } else { // sell
      const t = Math.min(f.t, 1);
      f.x = lerp(f.sx, SELL_STAND.x, t); f.y = lerp(f.sy, SELL_STAND.y - 25, t) - Math.sin(t * Math.PI) * 60;
      if (f.t >= 1) {
        flyers.splice(i, 1);
        const val = PRICES[f.type] || 1;
        S.coins += val; dirty = true;
        S.soldOnce = true;
        floater(SELL_STAND.x + rand(-14, 14), SELL_STAND.y - 60, '+' + val, '#ffd93d', 21);
        puff(SELL_STAND.x, SELL_STAND.y - 30, '#ffe9a0', 3);
        if (time - lastCoinSnd > 0.09) { AU.coin(); lastCoinSnd = time; }
        bumpCoins();
      }
    }
  }

  /* --- selling --- */
  if (started && S.carried.length > 0 && dist(P.x, P.y, SELL_ZONE.x, SELL_ZONE.y) < SELL_ZONE.r) {
    sellT += dt;
    if (sellT >= 0.11) {
      sellT = 0;
      const type = S.carried.pop();
      dirty = true;
      flyers.push({ type, mode: 'sell', t: 0, sx: P.x, sy: P.y - 40, x: P.x, y: P.y - 40 });
    }
  } else sellT = 0;

  /* --- fishing at the dock --- */
  if (started && !P.moving && dist(P.x, P.y, FISH_SPOT.x, FISH_SPOT.y) < 46) {
    if (freeSlots() >= 1) {
      if (!fishing.active) {
        fishing.active = true; fishing.t = 0; fishing.biting = false; fishing.biteT = 0;
        fishing.bx = FISH_SPOT.x + rand(-6, 12); fishing.by = FISH_SPOT.y + 34 + rand(-4, 6);
        fishing.wait = rand(1.3, 3.0);
        AU.pop(0.7);
      }
      fishing.t += dt;
      if (!fishing.biting && fishing.t >= fishing.wait) {
        fishing.biting = true; fishing.biteT = 0;
        floater(fishing.bx, fishing.by - 22, '!', '#ffe08a', 24); AU.tick();
      }
      if (fishing.biting) {
        fishing.biteT += dt;
        if (fishing.biteT >= 0.55) {
          collectItem('fish', fishing.bx, fishing.by - 6);
          puff(fishing.bx, fishing.by, '#bfe6ff', 7);
          floater(fishing.bx, fishing.by - 18, '🐟', '#bfe6ff', 20);
          AU.splash();
          fishing.active = false;   // recast automatically while still standing here
        }
      }
    } else { fishing.active = false; fullHint(); }
  } else fishing.active = false;

  /* --- buy zones --- */
  for (const z of ZONES) {
    if (S.un[z.id] || !z.vis(S.un)) continue;
    if (!started) continue;
    if (dist(P.x, P.y, z.x, z.y) < z.r + 6 && S.coins > 0) {
      payT += dt;
      const rate = Math.max(10, z.cost / 3.2);
      const interval = 0.07;
      if (payT >= interval) {
        payT = 0;
        const paid = S.paid[z.id] || 0;
        const chunk = Math.min(Math.max(1, Math.round(rate * interval)), z.cost - paid, S.coins);
        if (chunk > 0) {
          S.coins -= chunk; S.paid[z.id] = paid + chunk; dirty = true;
          coinParts.push({ sx: P.x, sy: P.y - 40, x: P.x, y: P.y - 40, tx: z.x, ty: z.y, t: 0 });
          payTick = (payTick + 1) % 3;
          if (payTick === 0) AU.tick();
          if (S.paid[z.id] >= z.cost) unlock(z);
        }
      }
    }
  }
  for (let i = coinParts.length - 1; i >= 0; i--) {
    const c = coinParts[i];
    c.t += dt / 0.35;
    const t = Math.min(c.t, 1);
    c.x = lerp(c.sx, c.tx, t); c.y = lerp(c.sy, c.ty, t) - Math.sin(t * Math.PI) * 34;
    if (c.t >= 1) coinParts.splice(i, 1);
  }

  /* --- fx --- */
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i]; f.t += dt;
    if (f.t > 1.3) floaters.splice(i, 1);
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.rot += p.vr * dt;
    if (p.t > p.life) parts.splice(i, 1);
  }
  if (fullHintT > 0) fullHintT -= dt;

  /* --- ambient birds --- */
  ambientChirpT -= dt;
  if (ambientChirpT <= 0) { ambientChirpT = rand(6, 14); if (started) AU.chirp(); }

  /* --- autosave --- */
  saveT += dt;
  if (saveT > 2.5) { saveT = 0; if (dirty) save(); }

  refreshHud();
}
let sellT = 0, payT = 0, payTick = 0, lastCoinSnd = 0;

function unlock(z) {
  S.un[z.id] = 1; dirty = true;
  AU.fanfare();
  confetti(z.x, z.y);
  floater(z.x, z.y - 55, z.label + ' 🎉', '#fff', 24);
  if (z.id === 'plot3') addPlot(PLOT_POS[2]), plots[plots.length - 1].spawnT = 0.001, plots[plots.length - 1].growth = 0.6;

function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function shadow(x, y, rx, ry) {
  ctx.fillStyle = 'rgba(25,60,15,0.16)';
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill();
}
function outlineText(txt, x, y, size, fill, stroke) {
  ctx.font = 'bold ' + size + 'px "Comic Sans MS","Chalkboard SE","Segoe UI",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = size / 5; ctx.lineJoin = 'round';

  ctx.fillStyle = fill; ctx.fillText(txt, x, y);
}
function smooth(a, b, t) { t = clamp((t - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function mixHex(h1, h2, t) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const r = Math.round(lerp((a >> 16) & 255, (b >> 16) & 255, t));
  const g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, t));
  const c = Math.round(lerp(a & 255, b & 255, t));
  return 'rgb(' + r + ',' + g + ',' + c + ')';
}
// 0 = full day, 1 = deepest night (long day, shorter night, gentle dusk/dawn ramps)
function nightAmount() { return clamp(smooth(0.46, 0.60, dayT) - smooth(0.90, 0.99, dayT), 0, 1); }

/* fence pieces (built as y-sorted drawables) */
function fencePieces(pen, gate) {
  const pieces = [];
  const post = (px, py) => ({ y: py, draw() {
    ctx.fillStyle = '#fdf6e3';
    rr(px - 4, py - 24, 8, 26, 3.5); ctx.fill();
    ctx.fillStyle = '#e8dcc0';
    ctx.beginPath(); ctx.ellipse(px, py - 24, 4, 2.5, 0, 0, TAU); ctx.fill();
  }});
  const gateSegs = (side, a, b) => {
    if (gate && gate.side === side) {
      return [[a, gate.at - gate.w / 2], [gate.at + gate.w / 2, b]];
    }
    return [[a, b]];
  };
  // top & bottom: one continuous double-rail bar per segment + evenly spaced posts
  for (const side of ['top', 'bottom']) {
    const py = side === 'top' ? pen.y : pen.y + pen.h;
    for (const [a, b] of gateSegs(side, pen.x, pen.x + pen.w)) {
      pieces.push({ y: py, draw() {
        ctx.fillStyle = '#fdf6e3';
        rr(a, py - 19, b - a, 5.5, 2.5); ctx.fill();
        rr(a, py - 10, b - a, 5.5, 2.5); ctx.fill();
      }});
      const n = Math.max(1, Math.round((b - a) / 44));
      for (let i = 0; i <= n; i++) pieces.push(post(a + (b - a) * i / n, py));
    }
  }
  // left & right: chunks of vertical band + post, each y-sorted at its own bottom
  for (const side of ['left', 'right']) {
    const px = side === 'left' ? pen.x : pen.x + pen.w;
    for (const [a, b] of gateSegs(side, pen.y, pen.y + pen.h)) {
      const n = Math.max(1, Math.round((b - a) / 44));
      for (let i = 1; i <= n; i++) {
        const y0 = a + (b - a) * (i - 1) / n, y1 = a + (b - a) * i / n;
        pieces.push({ y: y1, draw() {
          ctx.fillStyle = '#fdf6e3';
          rr(px - 3, y0 - 14, 6, y1 - y0 + 2, 3); ctx.fill();
        }});
        pieces.push(post(px, y1));
      }
    }
  }
  return pieces;
}

  // rod
  ctx.strokeStyle = '#7a4a21'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(handX, handY); ctx.lineTo(rodX, rodY); ctx.stroke();
  // line
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(rodX, rodY); ctx.lineTo(fishing.bx, by); ctx.stroke();
  // water ripple around bobber
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(fishing.bx, by + 3, 7, 3, 0, 0, TAU); ctx.stroke();
  // bobber (red top, white bottom)
  ctx.beginPath(); ctx.arc(fishing.bx, by, 4.5, Math.PI, TAU); ctx.fillStyle = '#e0273e'; ctx.fill();
  ctx.beginPath(); ctx.arc(fishing.bx, by, 4.5, 0, Math.PI); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.strokeStyle = 'rgba(120,30,30,0.6)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(fishing.bx, by, 4.5, 0, TAU); ctx.stroke();
  ctx.restore();
}
// Sun / moon / stars, drawn in screen space over the sky gradient.
function drawSky(night) {
  if (night > 0.35) {
    ctx.save(); ctx.fillStyle = '#fffbe0';
    for (const s of stars) {
      const tw = 0.6 + 0.4 * Math.sin(time * 2 + s.ph);
      ctx.globalAlpha = clamp((night - 0.35) * 1.4 * tw, 0, 1);
      ctx.beginPath(); ctx.arc(s.x * cssW, s.y * cssH * 0.6, s.r, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
  const isNight = dayT > 0.5;
  const seg = isNight ? (dayT - 0.5) / 0.5 : dayT / 0.5;
  const bx = cssW * (0.12 + seg * 0.76);
  const by = cssH * 0.34 - Math.sin(seg * Math.PI) * cssH * 0.22;
  ctx.save();
  if (!isNight) {
    const g = ctx.createRadialGradient(bx, by, 4, bx, by, 60);
    g.addColorStop(0, 'rgba(255,240,150,0.55)'); g.addColorStop(1, 'rgba(255,240,150,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by, 60, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffe14d'; ctx.beginPath(); ctx.arc(bx, by, 22, 0, TAU); ctx.fill();
  } else {
    const g = ctx.createRadialGradient(bx, by, 4, bx, by, 55);
    g.addColorStop(0, 'rgba(220,230,255,0.4)'); g.addColorStop(1, 'rgba(220,230,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by, 55, 0, TAU); ctx.fill();
    ctx.fillStyle = '#eef3ff'; ctx.beginPath(); ctx.arc(bx, by, 18, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(200,210,235,0.7)';
    ctx.beginPath(); ctx.arc(bx - 5, by - 4, 3.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + 6, by + 2, 2.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + 1, by + 7, 2, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function drawPaths() {
  ctx.save();
  ctx.strokeStyle = 'rgba(232,201,143,0.75)'; ctx.lineCap = 'round'; ctx.lineWidth = 34;
  ctx.beginPath();
  ctx.moveTo(420, 540); ctx.lineTo(SELL_ZONE.x - 20, SELL_ZONE.y - 30);
  ctx.moveTo(420, 540); ctx.lineTo(300, 420);
  ctx.moveTo(420, 540); ctx.lineTo(660, 520);
  ctx.stroke();
  ctx.restore();
}
function drawSellZone() {
  const z = SELL_ZONE;
  const pulse = (Math.sin(time * 3) + 1) / 2;
  ctx.save();
  ctx.beginPath(); ctx.ellipse(z.x, z.y, z.r, z.r * 0.62, 0, 0, TAU);
  ctx.fillStyle = 'rgba(255,235,160,0.5)'; ctx.fill();
  ctx.setLineDash([12, 9]);
  ctx.lineDashOffset = -time * 30;
  ctx.strokeStyle = 'rgba(240,170,40,0.9)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(z.x, z.y, z.r + pulse * 3, (z.r + pulse * 3) * 0.62, 0, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  // coin symbol
  ctx.beginPath(); ctx.arc(z.x, z.y, 13, 0, TAU);
  ctx.fillStyle = '#ffc93c'; ctx.fill();
  ctx.strokeStyle = '#d68f10'; ctx.lineWidth = 2.5; ctx.stroke();
  outlineText('$', z.x, z.y + 1, 15, '#a06a10', 'rgba(0,0,0,0)');
  ctx.restore();
}
function drawBuyZone(z) {
  const paid = S.paid[z.id] || 0;
  const remaining = z.cost - paid;
  const pulse = (Math.sin(time * 3 + z.x) + 1) / 2;
  ctx.save();
  ctx.beginPath(); ctx.ellipse(z.x, z.y, z.r, z.r * 0.62, 0, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(z.x, z.y, z.r + 2 + pulse * 3, (z.r + 2 + pulse * 3) * 0.62, 0, 0, TAU); ctx.stroke();
  // progress arc
  if (paid > 0) {
    ctx.strokeStyle = '#5cae2a'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.ellipse(z.x, z.y, z.r - 4, (z.r - 4) * 0.62, 0, -Math.PI / 2, -Math.PI / 2 + TAU * (paid / z.cost));
    ctx.stroke();
  }
  drawIcon(z.icon, z.x, z.y - 4, 1.15);
  ctx.restore();
}
function drawBuyZoneLabel(z) {
  const paid = S.paid[z.id] || 0;
  const remaining = z.cost - paid;
  ctx.save();
  // price pill
  const py = z.y - z.r * 0.62 - 26;
  const txt = String(remaining);
  ctx.font = 'bold 16px "Comic Sans MS","Chalkboard SE","Segoe UI",sans-serif';
  const tw = ctx.measureText(txt).width;
  const pw = tw + 42;
  rr(z.x - pw / 2, py - 14, pw, 28, 14);
  ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.fill();
  ctx.strokeStyle = '#ffc93c'; ctx.lineWidth = 2.5; ctx.stroke();
  // coin
  ctx.beginPath(); ctx.arc(z.x - pw / 2 + 15, py, 8.5, 0, TAU);
  ctx.fillStyle = '#ffc93c'; ctx.fill();
  ctx.strokeStyle = '#d68f10'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#6b4a1e'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, z.x - pw / 2 + 28, py + 1);
  // label
  outlineText(z.label, z.x, z.y + z.r * 0.62 + 16, 14, '#fff');
  ctx.restore();
}
function drawDrop(d) {
  const bob = Math.sin(time * 3 + d.bob) * 3;
  shadow(d.x, d.y + 6, 9, 3.5);
  drawItem(d.type, d.x, d.y - 6 + bob, 1.1);
  // sparkle
  const a = (Math.sin(time * 5 + d.bob) + 1) / 2;
  if (a > 0.7) {
    ctx.save(); ctx.globalAlpha = (a - 0.7) * 2.5;
    ctx.fillStyle = '#fff';
    ctx.translate(d.x + 8, d.y - 16 + bob);
    ctx.beginPath();
    for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); ctx.lineTo(0, -5); ctx.lineTo(1.5, -1.5); }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}
function drawCloud(c) {
  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#ffffff';
  ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
  ctx.beginPath();
  ctx.arc(-30, 0, 22, 0, TAU); ctx.arc(0, -10, 28, 0, TAU); ctx.arc(32, 0, 20, 0, TAU);
  ctx.arc(0, 6, 24, 0, TAU);
  ctx.fill();
  ctx.restore();
}

/* ---------------- main render ---------------- */
function render() {
  // camera
  const scale = clamp(Math.min(cssW, cssH) / 540, 0.5, 1.15);
  cam.scale = scale;
  const viewW = cssW / scale, viewH = cssH / scale;
  let cx = S.player.x, cy = S.player.y;
  cx = clamp(cx, Math.min(viewW / 2, WORLD.w / 2), Math.max(WORLD.w - viewW / 2, WORLD.w / 2));
  cy = clamp(cy, Math.min(viewH / 2, WORLD.h / 2), Math.max(WORLD.h - viewH / 2, WORLD.h / 2));
  cam.x = lerp(cam.x, cx, 0.12); cam.y = lerp(cam.y, cy, 0.12);

  // sky/water base
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const night = nightAmount();
  const grad = ctx.createLinearGradient(0, 0, 0, cssH);
  grad.addColorStop(0, mixHex('#5ecdf5', '#20305e', night));
  grad.addColorStop(1, mixHex('#3aa2dd', '#122238', night));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, cssW, cssH);
  drawSky(night);

  // world transform
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale,
    dpr * (cssW / 2 - cam.x * scale), dpr * (cssH / 2 - cam.y * scale));

  // water sparkles
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  for (const s of sparkles) {
    const tw = (Math.sin(time * 1.6 + s.ph) + 1) / 2;
    if (tw < 0.5) continue;
    ctx.globalAlpha = (tw - 0.5) * 1.4 * (1 - night * 0.85);
    ctx.beginPath(); ctx.moveTo(s.x - 7, s.y); ctx.quadraticCurveTo(s.x, s.y - 3, s.x + 7, s.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // islands & flat ground
  drawIsland(MAIN); drawIsland(FOREST);
  drawDock();
  drawBridgeDeck(); drawGhostBridge();
  drawPaths();
  for (const pl of plots) drawPlot(pl);
  drawSellZone();
  const visZones = ZONES.filter(z => !S.un[z.id] && z.vis(S.un) &&
    !(z.id === 'chick4' && !S.un.chick3) && !(z.id === 'chick3' && false));
  // hide chick4 until chick3 done, and don't show both at once
  const zonesToDraw = visZones.filter(z => !(z.id === 'chick4' && visZones.some(o => o.id === 'chick3')));
  for (const z of zonesToDraw) drawBuyZone(z);

  // y-sorted entities
  const drawables = [];
  drawables.push({ y: 252 + 6, draw: drawCoop });
  for (const t of trees) drawables.push({ y: t.y, draw: () => drawTree(t) });
  for (const b of bushes) drawables.push({ y: b.y, draw: () => drawBush(b) });
  for (const c of chickens) drawables.push({ y: c.y + 10, draw: () => drawChicken(c) });
  for (const c of cows) drawables.push({ y: c.y + 16, draw: () => drawCow(c) });
  for (const d of drops) drawables.push({ y: d.y, draw: () => drawDrop(d) });
  drawables.push({ y: SELL_STAND.y + 8, draw: drawStand });
  for (const f of chickenFence) drawables.push(f);
  if (S.un.cowpen) { if (!cowFence.length) cowFence = fencePieces(COW_PEN, { side: 'top', at: COW_PEN.x + COW_PEN.w / 2, w: 84 }); for (const f of cowFence) drawables.push(f); }
  drawables.push({ y: S.player.y, draw: drawPlayer });
  drawables.push({ y: cat.y, draw: () => drawCat(cat) });
  drawables.sort((a, b) => a.y - b.y);
  for (const d of drawables) d.draw();
  drawFishing();

  // flyers above everything
  for (const f of flyers) drawItem(f.type, f.x, f.y, 1.1, f.t * 4);
  // coin particles
  for (const c of coinParts) {
    ctx.beginPath(); ctx.arc(c.x, c.y, 6.5, 0, TAU);
    ctx.fillStyle = '#ffc93c'; ctx.fill();
    ctx.strokeStyle = '#d68f10'; ctx.lineWidth = 2; ctx.stroke();
  }
  // particles
  for (const p of parts) {
    ctx.save();
    ctx.globalAlpha = clamp(1 - p.t / p.life, 0, 1);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.col;
    ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.7);
    ctx.restore();
  }
  // buy-zone labels (never occluded)
  for (const z of zonesToDraw) drawBuyZoneLabel(z);
  // floaters
  for (const f of floaters) {
    const t = f.t / 1.3;
    ctx.save();
    ctx.globalAlpha = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;
    outlineText(f.txt, f.x, f.y - t * 44, f.size, f.col);
    ctx.restore();
  }
  // clouds float over the world
  for (const c of clouds) {
    c.x += c.v * 0.016;
    if (c.x > WORLD.w + 150) c.x = -150;
    drawCloud(c);
  }

  // ---- night overlay + cozy lantern light (screen space) ----
  if (night > 0.02) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.save();
    ctx.fillStyle = 'rgba(20,26,66,' + (night * 0.55).toFixed(3) + ')';
    ctx.fillRect(0, 0, cssW, cssH);
    ctx.globalCompositeOperation = 'lighter';
    const sc = cam.scale;
    const lamps = [
      { x: SELL_STAND.x, y: SELL_STAND.y - 42, r: 150 },
      { x: 178, y: 232, r: 130 },
      { x: S.player.x, y: S.player.y - 22, r: 120 },
    ];
    if (S.un.cowpen) lamps.push({ x: COW_PEN.x + COW_PEN.w / 2, y: COW_PEN.y + COW_PEN.h / 2, r: 130 });
    for (const L of lamps) {
      const sx = (L.x - cam.x) * sc + cssW / 2, sy = (L.y - cam.y) * sc + cssH / 2, r = L.r * sc;
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
      g.addColorStop(0, 'rgba(255,205,120,' + (0.5 * night).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,205,120,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  // screen-space: joystick
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (joy.active) {
    ctx.globalAlpha = 0.3;
    ctx.beginPath(); ctx.arc(joy.sx, joy.sy, 46, 0, TAU);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(joy.sx + joy.dx, joy.sy + joy.dy, 24, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* ---------------- boot ---------------- */
const overlay = document.getElementById('nameOverlay');
const nameInput = document.getElementById('nameInput');
const startBtn = document.getElementById('startBtn');
function beginGame(fresh) {
  started = true;
  elName.textContent = S.name + "'s Farm";
  elMute.textContent = AU.muted ? '🔇' : '🔊';
  overlay.classList.add('hidden');
  if (fresh) {
    floater(S.player.x, S.player.y - 80, 'Welcome, ' + S.name + '! 💛', '#fff', 22);
    save();
  }
}
startBtn.addEventListener('click', () => {
  AU.init();
  S.name = (nameInput.value || '').trim() || 'Farmer';
  AU.fanfare();
  beginGame(true);
});
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') startBtn.click(); });

const hasSave = load();
buildWorld();
if (hasSave) beginGame(false);
else overlay.classList.remove('hidden');

window.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
window.addEventListener('pagehide', () => save());

let last = performance.now(), sizeCheck = 0;
function frame(now) {
  requestAnimationFrame(frame);
  // Self-heal: iOS fires viewport changes inconsistently as its toolbars slide
  // away, so re-measure periodically. resize() early-returns when nothing moved.
  if (++sizeCheck % 15 === 0) resize();
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  render();
}
requestAnimationFrame(frame);
</script>
