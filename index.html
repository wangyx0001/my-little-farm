<title>My Little Farm</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { overscroll-behavior:none; background:#1f93d4;
    font-family:"Comic Sans MS","Chalkboard SE","Segoe UI Rounded","Segoe UI",sans-serif;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  /* Everything lives in #stage, whose pixel size JS sets explicitly. iOS Safari
     reports a layout viewport that disappears behind its toolbars, so a CSS
     height of 100% would be wrong — JS sizes #stage off visualViewport instead. */
  html, body { height:100%; overflow:hidden; }
  #stage { position:fixed; top:0; left:0; overflow:hidden; touch-action:none; margin:0 auto; }
  #game { position:absolute; inset:0; display:block; }
  /* ---------- HUD ---------- */
  #hud { position:absolute; inset:0; pointer-events:none; z-index:5; }
  /* Township-style HUD: dark glassy bars with chunky white numbers */
  .pill { background:linear-gradient(180deg, rgba(28,40,58,0.82), rgba(14,22,34,0.82)); border-radius:999px;
    padding:5px 16px 5px 10px; border:2px solid rgba(255,255,255,0.55);
    box-shadow:0 3px 0 rgba(0,0,0,0.25), inset 0 2px 0 rgba(255,255,255,0.15); font-weight:bold; color:#fff; font-size:17px;
    text-shadow:0 2px 0 rgba(0,0,0,0.45); display:flex; align-items:center; gap:8px; }
  #titlePill { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:calc(10px + env(safe-area-inset-left));
    background:linear-gradient(180deg,#5cc4ff,#1f7fd8); border:3px solid #fff; padding:5px 16px 5px 12px;
    box-shadow:0 4px 0 #15569a, 0 6px 10px rgba(0,0,0,0.2); color:#fff7c2; font-size:17px;
    text-shadow:0 2px 0 #0f4a86, 0 0 3px #0f4a86; }
  #rightHud { position:absolute; top:calc(10px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right));
    display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  #coinPill { font-size:22px; min-width:96px; }
  /* green banknote drawn in CSS (HUD + shop) */
  .cashIcon { position:relative; width:30px; height:19px; border-radius:4px; flex:0 0 auto; display:inline-block;
    background:linear-gradient(180deg,#a3ee8e,#3aa047); border:2px solid #237a30;
    box-shadow:2px 2px 0 #1f6a2a, 0 3px 3px rgba(0,0,0,0.25); transform:rotate(-8deg); }
  .cashIcon::after { content:'$'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:bold; color:#1f6a2a; text-shadow:none; }
  .cashIcon.mini { width:16px; height:10px; border-width:1.5px; border-radius:2px; box-shadow:1px 1px 0 #1f6a2a; vertical-align:-1px; margin-right:2px; }
  .cashIcon.mini::after { font-size:7px; }
  #coinPill.bump { animation:bump 0.25s ease; }
  @keyframes bump { 40% { transform:scale(1.18); } }
  #bagPill { font-size:15px; }
  #bagPill.full { background:linear-gradient(180deg,#ff6b6b,#d63031); animation:pulse 0.8s ease infinite; }
  @keyframes pulse { 50% { transform:scale(1.08); } }
  #muteBtn { position:absolute; top:calc(62px + env(safe-area-inset-top)); left:calc(10px + env(safe-area-inset-left));
    pointer-events:auto; width:46px; height:46px; border-radius:50%; border:3px solid #fff; font-size:20px;
    background:radial-gradient(circle at 35% 28%, #ffffff, #d4e8f8 70%, #a9c8e4);
    box-shadow:0 4px 0 #6f93b5, 0 6px 8px rgba(0,0,0,0.2); cursor:pointer; }
  #muteBtn:active { transform:translateY(3px); box-shadow:0 1px 0 #6f93b5; }
  #shopBtn { position:absolute; top:calc(116px + env(safe-area-inset-top)); left:calc(10px + env(safe-area-inset-left));
    pointer-events:auto; width:46px; height:46px; border-radius:50%; border:3px solid #fff; font-size:20px;
    background:radial-gradient(circle at 35% 28%, #ffffff, #d4e8f8 70%, #a9c8e4);
    box-shadow:0 4px 0 #6f93b5, 0 6px 8px rgba(0,0,0,0.2); cursor:pointer; }
  #shopBtn:active { transform:translateY(3px); box-shadow:0 1px 0 #6f93b5; }
  /* ---------- Dress-up shop ---------- */
  #shopOverlay { position:absolute; inset:0; z-index:11; display:flex; align-items:center; justify-content:center;
    background:rgba(40,60,90,0.45); backdrop-filter:blur(3px); transition:opacity 0.25s ease; padding:20px; }
  #shopOverlay.hidden { opacity:0; pointer-events:none; }
  .shopPanel { position:relative; background:linear-gradient(180deg,#fffbe8,#ffe7a8); border-radius:26px;
    padding:0 22px 26px; box-shadow:0 8px 0 #c98a3a, 0 20px 60px rgba(0,0,0,0.3);
    max-width:360px; width:100%; border:5px solid #fff; text-align:center; overflow:hidden; }
  .shopPanel h2 { margin:0 -22px 12px; padding:12px 50px; font-size:23px; color:#fff7c2;
    background:linear-gradient(180deg,#5cc4ff,#1f7fd8); box-shadow:inset 0 -4px 0 #15569a;
    text-shadow:0 2px 0 #0f4a86, 0 0 3px #0f4a86; }
  .shopPanel h3 { color:#9a6b35; font-size:16px; margin:14px 0 8px; text-align:left; }
  .shopCoins { display:inline-flex; align-items:center; gap:6px; font-weight:bold; color:#6b4a1e; font-size:19px; }
  .swatchRow { display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-start; }
  .swatch { position:relative; width:52px; height:52px; border-radius:50%; border:3px solid #fff; cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,0.14); padding:0; }
  .swatch:active { transform:scale(0.93); }
  .swatch.equipped { border-color:#4caf2a; box-shadow:0 0 0 3px #8ed04d, 0 3px 0 rgba(0,0,0,0.14); }
  .swatch .chk { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:22px; text-shadow:0 1px 2px rgba(0,0,0,0.4); }
  .swatch .price { position:absolute; bottom:-9px; left:50%; transform:translateX(-50%);
    background:#fffbe8; border:2px solid #ffc93c; border-radius:10px; font-size:11px; font-weight:bold;
    color:#6b4a1e; padding:0 5px; white-space:nowrap; }
  .swatch.locked { filter:saturate(0.5) brightness(0.9); }
  #shopClose { position:absolute; top:9px; right:10px; z-index:1; width:34px; height:34px; border-radius:50%; border:none;
    background:#f0663d; color:#fff; font-size:16px; font-weight:bold; cursor:pointer; box-shadow:0 3px 0 #c34a25; }
  #shopClose:active { transform:translateY(2px); box-shadow:0 1px 0 #c34a25; }
  /* ---------- Name overlay ---------- */
  #nameOverlay { position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, rgba(72,210,240,0.75), rgba(31,147,212,0.88)); backdrop-filter:blur(3px);
    transition:opacity 0.4s ease; padding:20px; }
  #nameOverlay.hidden { opacity:0; pointer-events:none; }
  #nameOverlay .panel { background:linear-gradient(180deg,#fffbe8,#ffe7a8); border-radius:28px; padding:28px 26px;
    text-align:center; box-shadow:0 8px 0 #c98a3a, 0 20px 60px rgba(0,0,0,0.3);
    max-width:340px; width:100%; border:5px solid #fff; }
  #nameOverlay .big { font-size:44px; letter-spacing:4px; }
  #nameOverlay h1 { color:#7a3d12; font-size:25px; margin:10px 0 4px; text-shadow:0 2px 0 #fff; }
  #nameOverlay p { color:#9a6b35; font-size:17px; margin-bottom:14px; }
  #nameInput { width:100%; font-size:22px; text-align:center; padding:10px; border-radius:16px;
    border:3px solid #e8b866; outline:none; font-family:inherit; color:#6b4a1e; background:#fff; }
  #nameInput:focus { border-color:#6bbf3a; }
  #startBtn { margin-top:16px; width:100%; font-size:22px; font-weight:bold; font-family:inherit; color:#fff;
    background:linear-gradient(180deg,#8ed04d,#5cae2a); border:none; border-radius:18px; padding:13px;
    box-shadow:0 5px 0 #3f8618; cursor:pointer; }
  #startBtn:active { transform:translateY(3px); box-shadow:0 2px 0 #3f8618; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="titlePill" class="pill">🌻 <span id="farmName">My Little Farm</span></div>
    <button id="muteBtn">🔊</button>
    <button id="shopBtn">🎨</button>
    <div id="rightHud">
      <div id="coinPill" class="pill"><span class="cashIcon"></span><span id="coinCount">0</span></div>
      <div id="bagPill" class="pill">🧺 <span id="bagCount">0/8</span></div>
    </div>
  </div>
  <div id="nameOverlay" class="hidden">
    <div class="panel">
      <div class="big">🐔🌾🐮</div>
      <h1>Welcome to your new farm!</h1>
      <p>What's your name, farmer?</p>
      <input id="nameInput" maxlength="14" placeholder="Your name" autocomplete="off">
      <button id="startBtn">Let's farm! 🌻</button>
    </div>
  </div>
  <div id="shopOverlay" class="hidden">
    <div class="shopPanel">
      <button id="shopClose" aria-label="Close">✕</button>
      <h2>🎨 Dress Up!</h2>
      <div class="shopCoins"><span class="cashIcon"></span><span id="shopCoinCount">0</span></div>
      <h3>👧 Farmer's dress</h3>
      <div class="swatchRow" id="dressRow"></div>
      <h3>🐱 Kitty's fur</h3>
      <div class="swatchRow" id="catRow"></div>
    </div>
  </div>
</div>
<script>
'use strict';
/* ================================================================
   MY LITTLE FARM — a Farm Land–style island farm game
   Single file, no dependencies. Art drawn on Canvas 2D.
   ================================================================ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

const canvas = document.getElementById('game');
const stage = document.getElementById('stage');
let ctx = canvas.getContext('2d');   // `let`: withCtx() points the draw* functions at offscreen canvases while baking
let cssW = 0, cssH = 0, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  // visualViewport excludes the iOS Safari toolbars; innerHeight does not.
  const vv = window.visualViewport;
  const w = Math.round((vv && vv.width) || window.innerWidth || 360);
  const h = Math.round((vv && vv.height) || window.innerHeight || 640);
  if (w === cssW && h === cssH) return;
  cssW = w; cssH = h;
  stage.style.width = w + 'px';
  stage.style.height = h + 'px';
  // The canvas needs an explicit CSS size: browsers otherwise lay it out at its
  // width/height *attribute* size, which is dpr times too big and overflows.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
}
// Called directly rather than coalesced through requestAnimationFrame: resize()
// is cheap (it early-returns when nothing moved), and this avoids a queued-flag
// that could latch on and freeze the game at the wrong size if rAF is throttled.
function queueResize() { resize(); }
window.addEventListener('resize', queueResize);
window.addEventListener('orientationchange', queueResize);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', queueResize);
  window.visualViewport.addEventListener('scroll', queueResize);
}
if (window.ResizeObserver) {
  const ro = new ResizeObserver(queueResize);
  ro.observe(document.documentElement);
  if (document.body) ro.observe(document.body);
}
resize();

/* ---------------- Audio (all sounds synthesized) ---------------- */
const AU = {
  ctx: null, muted: false,
  unlocked: false,
  init() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (!this.ctx) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    // iOS keeps the context muted until a buffer is started inside a gesture.
    if (!this.unlocked) {
      this.unlocked = true;
      try {
        const src = this.ctx.createBufferSource();
        src.buffer = this.ctx.createBuffer(1, 1, 22050);
        src.connect(this.ctx.destination);
        src.start(0);
      } catch (e) {}
    }
  },
  tone(o) {
    if (!this.ctx || this.muted) return;
    const { f = 440, f2 = 0, type = 'sine', dur = 0.15, vol = 0.2, delay = 0 } = o;
    const t0 = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f, t0);
    if (f2) osc.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(this.ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  },
  noise(o) {
    if (!this.ctx || this.muted) return;
    const { dur = 0.1, vol = 0.15, f = 1200, delay = 0 } = o;
    const t0 = this.ctx.currentTime + delay;
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 0.8;
    const g = this.ctx.createGain(); g.gain.value = vol;
    src.connect(bp).connect(g).connect(this.ctx.destination);
    src.start(t0);
  },
  coin()   { this.tone({ f: 987, f2: 1319, dur: 0.09, vol: 0.10 }); this.tone({ f: 1319, f2: 1976, dur: 0.15, vol: 0.09, delay: 0.06 }); },
  pop(p)   { p = p || 1; this.tone({ f: 400 * p, f2: 820 * p, type: 'triangle', dur: 0.09, vol: 0.13 }); },
  chop()   { this.noise({ dur: 0.07, vol: 0.32, f: 700 }); this.tone({ f: 150, f2: 80, type: 'square', dur: 0.08, vol: 0.09 }); },
  thud()   { this.tone({ f: 240, f2: 170, dur: 0.14, vol: 0.14 }); this.tone({ f: 190, f2: 130, dur: 0.16, vol: 0.11, delay: 0.13 }); },
  tick()   { this.tone({ f: 720, f2: 950, dur: 0.045, vol: 0.05 }); },
  chirp()  { const b = rand(1700, 2600); this.tone({ f: b, f2: b * 1.4, dur: 0.07, vol: 0.03 }); this.tone({ f: b * 1.1, f2: b * 0.85, dur: 0.09, vol: 0.025, delay: 0.1 }); },
  moo()    { this.tone({ f: 180, f2: 140, type: 'sawtooth', dur: 0.4, vol: 0.04 }); },
  cluck()  { this.tone({ f: 520, f2: 380, type: 'square', dur: 0.06, vol: 0.03 }); },
  meow()   { this.tone({ f: 660, f2: 900, type: 'sine', dur: 0.12, vol: 0.05 }); this.tone({ f: 880, f2: 540, type: 'sine', dur: 0.2, vol: 0.05, delay: 0.1 }); },
  baa()    { this.tone({ f: 340, f2: 250, type: 'sawtooth', dur: 0.32, vol: 0.04 }); this.tone({ f: 300, f2: 330, type: 'sawtooth', dur: 0.16, vol: 0.03, delay: 0.16 }); },
  splash() { this.noise({ dur: 0.18, vol: 0.12, f: 900 }); this.tone({ f: 520, f2: 920, type: 'sine', dur: 0.12, vol: 0.04 }); },
  fanfare(){ [523, 659, 784, 1047].forEach((f, i) => { this.tone({ f, type: 'triangle', dur: 0.24, vol: 0.15, delay: i * 0.1 }); this.tone({ f: f * 2, type: 'sine', dur: 0.2, vol: 0.05, delay: i * 0.1 }); }); },
};

/* ---------------- Save / load ---------------- */
const SAVE_KEY = 'myLittleFarm.v1';
function save() {
  if (!started) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 1, name: S.name, coins: S.coins, muted: AU.muted,
      carried: S.carried, un: S.un, paid: S.paid, soldOnce: S.soldOnce, cos: S.cos,
      counter: S.counter, pile: S.pile, cashOnce: S.cashOnce,
    }));
  } catch (e) {}
  dirty = false;
}
function load() {
  try {
    if (location.search.indexOf('reset') >= 0) { localStorage.removeItem(SAVE_KEY); return false; }
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    S.name = d.name || 'Farmer'; S.coins = d.coins || 0; AU.muted = !!d.muted;
    S.carried = Array.isArray(d.carried) ? d.carried.slice(0, 40) : [];
    Object.assign(S.un, d.un || {}); S.paid = d.paid || {}; S.soldOnce = !!d.soldOnce;
    if (d.counter && typeof d.counter === 'object')
      for (const t of ITEM_ORDER) if (d.counter[t] > 0) S.counter[t] = d.counter[t] | 0;
    S.pile = Math.max(0, d.pile | 0); S.cashOnce = !!d.cashOnce;
    if (d.cos) {
      S.cos.dress = d.cos.dress | 0; S.cos.cat = d.cos.cat | 0;
      if (Array.isArray(d.cos.ownDress) && d.cos.ownDress.length) S.cos.ownDress = d.cos.ownDress;
      if (Array.isArray(d.cos.ownCat) && d.cos.ownCat.length) S.cos.ownCat = d.cos.ownCat;
      if (!S.cos.ownDress.includes(0)) S.cos.ownDress.push(0);
      if (!S.cos.ownCat.includes(0)) S.cos.ownCat.push(0);
      if (!S.cos.ownDress.includes(S.cos.dress)) S.cos.dress = 0;
      if (!S.cos.ownCat.includes(S.cos.cat)) S.cos.cat = 0;
    }
    return true;
  } catch (e) { return false; }
}

// Where each item type's tower stands on the counter (up to 4 types, most plentiful first,
// then in a stable left-to-right order so towers don't jump around).
function counterSlots() {
  const types = ITEM_ORDER.filter(t => S.counter[t] > 0)
    .sort((a, b) => S.counter[b] - S.counter[a]).slice(0, 4)
    .sort((a, b) => ITEM_ORDER.indexOf(a) - ITEM_ORDER.indexOf(b));
  return types.map((t, i) => ({ type: t, n: S.counter[t], x: SELL_STAND.x - 46 + i * 24, y: SELL_STAND.y - 30 }));
}
function bestCounterType() {
  let best = null;
  for (const t of ITEM_ORDER) if (S.counter[t] > 0 && (!best || S.counter[t] > S.counter[best])) best = t;
  return best;
}

function walkableRects() {
  const r = [MAIN, FOREST, DOCK];
  if (S.un.bridge) r.push(BRIDGE);
  return r;
}
function isWalkable(x, y) {
  const m = 20;
  for (const r of walkableRects())
    if (x > r.x + m && x < r.x + r.w - m && y > r.y + m && y < r.y + r.h - m) return true;
  return false;
}

/* ---------------- Input ---------------- */
const joy = { active: false, id: -1, sx: 0, sy: 0, dx: 0, dy: 0 };
const keys = {};
// Pointer positions must be canvas-local: the stage is centered on very wide
// screens, and sits below the host header when embedded.
function localPt(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { x: clientX - r.left, y: clientY - r.top };
}
function joyStart(id, clientX, clientY) {
  AU.init();
  if (!started || joy.active) return;
  const p = localPt(clientX, clientY);
  joy.active = true; joy.id = id;
  joy.sx = p.x; joy.sy = p.y; joy.dx = 0; joy.dy = 0;
}
function joyMove(id, clientX, clientY) {
  if (!joy.active || id !== joy.id) return;
  const R = 58;
  const p = localPt(clientX, clientY);
  let dx = p.x - joy.sx, dy = p.y - joy.sy;
  const d = Math.hypot(dx, dy);
  if (d > R) {
    // drag the joystick base along so steering stays comfy on long swipes
    joy.sx += dx / d * (d - R); joy.sy += dy / d * (d - R);
    dx = dx / d * R; dy = dy / d * R;
  }
  joy.dx = dx; joy.dy = dy;
}
function joyStop(id) { if (joy.active && id === joy.id) { joy.active = false; joy.dx = joy.dy = 0; } }

if (window.PointerEvent) {
  canvas.addEventListener('pointerdown', e => {
    joyStart(e.pointerId, e.clientX, e.clientY);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', e => joyMove(e.pointerId, e.clientX, e.clientY));
  canvas.addEventListener('pointerup', e => joyStop(e.pointerId));
  canvas.addEventListener('pointercancel', e => joyStop(e.pointerId));
} else { // older iOS Safari
  canvas.addEventListener('touchstart', e => {
    const t = e.changedTouches[0]; joyStart(t.identifier, t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) joyMove(t.identifier, t.clientX, t.clientY);
  }, { passive: true });
  const endTouch = e => { for (const t of e.changedTouches) joyStop(t.identifier); };
  canvas.addEventListener('touchend', endTouch, { passive: true });
  canvas.addEventListener('touchcancel', endTouch, { passive: true });
}
// iOS ignores touch-action in some embedded contexts; belt and braces.
canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

function inputVector() {
  if (joy.active) {
    const d = Math.hypot(joy.dx, joy.dy);
    if (d < 8) return { x: 0, y: 0 };
    const m = clamp((d - 8) / 40, 0, 1);
    return { x: joy.dx / d * m, y: joy.dy / d * m };
  }
  let x = 0, y = 0;
  if (keys.arrowleft || keys.a) x -= 1;
  if (keys.arrowright || keys.d) x += 1;
  if (keys.arrowup || keys.w) y -= 1;
  if (keys.arrowdown || keys.s) y += 1;
  const d = Math.hypot(x, y);
  return d ? { x: x / d, y: y / d } : { x: 0, y: 0 };
}

  elCoinPill.classList.add('bump');
}
elMute.addEventListener('click', () => {
  AU.init(); AU.muted = !AU.muted;
  elMute.textContent = AU.muted ? '🔇' : '🔊';
  dirty = true; save();
});

/* ---------------- Dress-up shop ---------------- */
const shopOverlay = document.getElementById('shopOverlay');
const shopBtn = document.getElementById('shopBtn');
const shopClose = document.getElementById('shopClose');
function renderSwatchRow(rowEl, colors, cost, kind) {
  const own = kind === 'dress' ? S.cos.ownDress : S.cos.ownCat;
  const cur = kind === 'dress' ? S.cos.dress : S.cos.cat;
  rowEl.innerHTML = '';
  colors.forEach((col, i) => {
    const owned = own.includes(i);
    const sw = document.createElement('button');
    sw.className = 'swatch' + (cur === i ? ' equipped' : '') + (owned ? '' : ' locked');
    sw.style.background = col;
    if (cur === i) { const chk = document.createElement('span'); chk.className = 'chk'; chk.textContent = '✓'; sw.appendChild(chk); }
    else if (!owned) { const tag = document.createElement('span'); tag.className = 'price'; tag.innerHTML = '<span class="cashIcon mini"></span>' + cost; sw.appendChild(tag); }
    sw.addEventListener('click', () => {
      AU.init();
      if (owned) {
        if (kind === 'dress') S.cos.dress = i; else S.cos.cat = i;
        AU.pop(1.15);
      } else if (S.coins >= cost) {
        S.coins -= cost; own.push(i);
        if (kind === 'dress') S.cos.dress = i; else S.cos.cat = i;
        AU.coin(); bumpCoins();
      } else { AU.thud(); return; }
      dirty = true; save(); refreshHud(); buildShop();
    });
    rowEl.appendChild(sw);
  });
}
function buildShop() {
  document.getElementById('shopCoinCount').textContent = S.coins;
  renderSwatchRow(document.getElementById('dressRow'), DRESS_COLORS, DRESS_COST, 'dress');
  renderSwatchRow(document.getElementById('catRow'), CAT_COLORS, CAT_COST, 'cat');
}
function openShop() { AU.init(); buildShop(); shopOverlay.classList.remove('hidden'); }
function closeShop() { shopOverlay.classList.add('hidden'); }
shopBtn.addEventListener('click', openShop);
shopClose.addEventListener('click', closeShop);
shopOverlay.addEventListener('click', e => { if (e.target === shopOverlay) closeShop(); });

/* ---------------- Helpers: fx ---------------- */
function floater(x, y, txt, col, size) {
  floaters.push({ x, y, txt, col: col || '#ffffff', size: size || 20, t: 0 });
}
function confetti(x, y) {
  const cols = ['#ff6b81', '#ffd93d', '#6bcB77', '#4d96ff', '#ff9f45', '#c780fa'];
  for (let i = 0; i < 36; i++) {
    const a = rand(0, TAU), sp = rand(60, 260);
    parts.push({ x, y: y - 10, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 140,
      col: pick(cols), t: 0, life: rand(0.7, 1.3), r: rand(3, 6), rot: rand(0, TAU), vr: rand(-8, 8) });
  }
}
function puff(x, y, col, n) {
  for (let i = 0; i < (n || 6); i++) {
    const a = rand(0, TAU), sp = rand(20, 80);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
      col: col || '#ffffff', t: 0, life: rand(0.3, 0.6), r: rand(2, 4), rot: 0, vr: 0 });
  }
}
function freeSlots() { return cap() - S.carried.length - reserved; }
function collectItem(type, x, y) {
  reserved++;
  flyers.push({ type, x, y, t: 0, mode: 'stack', sx: x, sy: y });
  AU.pop(rand(0.9, 1.2));
}
function fullHint() {
  if (fullHintT > 0) return;
  fullHintT = 2.6;
  floater(S.player.x, S.player.y - 78, 'Basket full! Go sell! 🧺', '#ffe08a', 19);
  AU.thud();
}

/* ---------------- Update ---------------- */
let time = 0;
function update(dt) {
  time += dt;
  dayT = (dayT + dt / DAY_LEN) % 1;
  const P = S.player;

  /* --- movement --- */
  const iv = started ? inputVector() : { x: 0, y: 0 };
  const sp = speed();
  P.vx = iv.x * sp; P.vy = iv.y * sp;
  P.moving = (iv.x !== 0 || iv.y !== 0);
  if (P.moving) {
    let nx = P.x + P.vx * dt, ny = P.y + P.vy * dt;
    if (isWalkable(nx, ny)) { P.x = nx; P.y = ny; }
    else if (isWalkable(nx, P.y)) { P.x = nx; }
    else if (isWalkable(P.x, ny)) { P.y = ny; }
    if (Math.abs(P.vx) > 10) P.flip = P.vx < 0;
    P.walkPhase += dt * 13;
  } else P.walkPhase = 0;
  P.lean = lerp(P.lean, clamp(P.vx * 0.0022, -0.3, 0.3), dt * 8);
  P.blink -= dt; if (P.blink < -3) P.blink = rand(0.1, 0.18);

  /* --- pet cat trots after the farmer --- */
  {
    const c = cat;
    const tx = P.x - (P.flip ? -30 : 30), ty = P.y + 14;
    const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy);
    if (d > 320) { const ok = isWalkable(tx, ty); c.x = ok ? tx : P.x; c.y = ok ? ty : P.y; }   // catch up if left far behind (e.g. across the bridge) — never onto water
    else if (d > 8) {
      const spd = clamp(d * 3.2, 0, speed() * 1.5);
      const nx = c.x + dx / d * spd * dt, ny = c.y + dy / d * spd * dt;
      if (isWalkable(nx, ny)) { c.x = nx; c.y = ny; }
      else if (isWalkable(nx, c.y)) c.x = nx;
      else if (isWalkable(c.x, ny)) c.y = ny;
      if (Math.abs(dx) > 4) c.flip = dx < 0;
    }
    c.moving = d > 22;
    if (c.moving) { c.walkPhase += dt * 12; c.sit = Math.max(0, c.sit - dt * 4); }
    else { c.walkPhase = 0; c.sit = Math.min(1, c.sit + dt * 2); }
    c.tail += dt * (c.moving ? 6 : 2.2);
    c.blink -= dt; if (c.blink < -3) c.blink = rand(0.1, 0.18);
    c.meowT -= dt;
    if (c.meowT <= 0) { c.meowT = rand(9, 18); if (started && !c.moving) { AU.meow(); floater(c.x, c.y - 26, '♪', '#ffd0e0', 15); } }
  }

  /* --- trees: chopping --- */
  P.chopping = false;
  let tgt = null, best = 1e9;
  for (const t of trees) {
    if (t.hp <= 0) {
      t.regrow -= dt;
      if (t.regrow <= 0) { t.hp = 3; t.spawnT = 0.001; puff(t.x, t.y - 30, '#a5e06b', 8); }
      continue;
    }
    if (t.spawnT > 0 && t.spawnT < 0.4) t.spawnT += dt;
    const d = dist(P.x, P.y, t.x, t.y);
    if (d < 74 && d < best) { best = d; tgt = t; }
    t.wob = Math.max(0, t.wob - dt * 3);
  }
  if (tgt && started) {
    if (freeSlots() >= 1) {
      P.chopping = true;
      if (!P.moving) P.flip = tgt.x < P.x;
      P.chopT += dt;
      const CHOP = S.un.diamond ? 0.28 : S.un.gold ? 0.38 : 0.62;
      if (P.chopT >= CHOP) {
        P.chopT = 0;
        tgt.hp--; tgt.wob = 1;
        AU.chop();
        puff(tgt.x + rand(-10, 10), tgt.y - rand(30, 55), '#c9e8a0', 4);
        collectItem('wood', tgt.x + rand(-8, 8), tgt.y - 30);
        if (tgt.hp <= 0) { tgt.regrow = 22; puff(tgt.x, tgt.y - 20, '#e8d5a0', 10); }
      }
    } else { P.chopT = 0; fullHint(); }
  } else P.chopT = 0;

  /* --- wheat plots --- */
  for (const pl of plots) {
    if (pl.spawnT > 0 && pl.spawnT < 0.5) pl.spawnT += dt;
    if (pl.growth < 1) pl.growth = Math.min(1, pl.growth + dt / 11);
    else if (started && Math.abs(P.x - pl.x) < PLOT_SIZE.w / 2 + 8 && Math.abs(P.y - pl.y) < PLOT_SIZE.h / 2 + 10) {
      const want = 3 + (S.un.gold ? 1 : 0) + (S.un.diamond ? 1 : 0);
      const n = Math.min(want, freeSlots());
      if (n <= 0) { fullHint(); continue; }
      pl.growth = 0;
      for (let i = 0; i < n; i++) {
        const tf = pl.tufts[i % pl.tufts.length];
        collectItem('wheat', pl.x + tf.dx, pl.y + tf.dy - 10);
      }
      floater(pl.x, pl.y - 30, '🌾', '#ffe08a', 22);
    }
  }

  /* --- berry bushes --- */
  for (const b of bushes) {
    if (b.spawnT > 0 && b.spawnT < 0.5) b.spawnT += dt;
    if (b.growth < 1) b.growth = Math.min(1, b.growth + dt / 14);
    else if (started && dist(P.x, P.y, b.x, b.y) < 46) {
      const want = 2 + (S.un.gold ? 1 : 0) + (S.un.diamond ? 1 : 0);
      const n = Math.min(want, freeSlots());
      if (n <= 0) { fullHint(); continue; }
      b.growth = 0;
      for (let i = 0; i < n; i++) collectItem('berry', b.x + rand(-14, 14), b.y - rand(10, 26));
      puff(b.x, b.y - 16, '#ff8aa0', 5);
    }
  }

  /* --- chickens --- */
  const eggsOnGround = drops.filter(d => d.type === 'egg').length;
  for (const c of chickens) {
    if (c.spawnT > 0 && c.spawnT < 0.5) c.spawnT += dt;
    c.moveT -= dt;
    if (c.moveT <= 0) {
      c.moveT = rand(1.5, 4);
      c.tx = rand(CHICKEN_PEN.x + 25, CHICKEN_PEN.x + CHICKEN_PEN.w - 25);
      c.ty = rand(CHICKEN_PEN.y + 35, CHICKEN_PEN.y + CHICKEN_PEN.h - 20);
    }
    const dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy);
    if (d > 4) {
      c.x += dx / d * 26 * dt; c.y += dy / d * 26 * dt;
      c.flip = dx < 0; c.hop += dt * 10;
    }
    c.peckT -= dt; if (c.peckT < -0.6) c.peckT = rand(1.5, 4);
    c.layT -= dt;
    if (c.layT <= 0) {
      c.layT = rand(7, 13);
      if (eggsOnGround < 4) {
        drops.push({ type: 'egg', x: clamp(c.x - 12, CHICKEN_PEN.x + 15, CHICKEN_PEN.x + CHICKEN_PEN.w - 15),
                     y: clamp(c.y + 6, CHICKEN_PEN.y + 25, CHICKEN_PEN.y + CHICKEN_PEN.h - 10),
                     bob: Math.random() * TAU, taken: false });
        c.hop = 0; AU.cluck();
        puff(c.x, c.y - 8, '#fff', 3);
      }
    }
  }

  /* --- cows --- */
  const milkOnGround = drops.filter(d => d.type === 'milk').length;
  for (const c of cows) {
    if (c.spawnT > 0 && c.spawnT < 0.5) c.spawnT += dt;
    c.moveT -= dt;
    if (c.moveT <= 0) {
      c.moveT = rand(2.5, 6);
      c.tx = rand(COW_PEN.x + 45, COW_PEN.x + COW_PEN.w - 45);
      c.ty = rand(COW_PEN.y + 55, COW_PEN.y + COW_PEN.h - 30);
    }
    const dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy);
    if (d > 5) { c.x += dx / d * 18 * dt; c.y += dy / d * 18 * dt; c.flip = dx < 0; }
    c.milkT -= dt;
    if (c.milkT <= 0) {
      c.milkT = rand(14, 22);
      if (milkOnGround < 3) {
        drops.push({ type: 'milk', x: c.x + rand(-10, 10), y: c.y + 12, bob: Math.random() * TAU, taken: false });
        AU.moo();
      }
    }
  }

  /* --- sheep --- */
  const woolOnGround = drops.filter(d => d.type === 'wool').length;
  for (const s of sheeps) {
    if (s.spawnT > 0 && s.spawnT < 0.5) s.spawnT += dt;
    s.moveT -= dt;
    if (s.moveT <= 0) {
      s.moveT = rand(2.5, 6);
      s.tx = rand(SHEEP_PEN.x + 40, SHEEP_PEN.x + SHEEP_PEN.w - 40);
      s.ty = rand(SHEEP_PEN.y + 50, SHEEP_PEN.y + SHEEP_PEN.h - 30);
    }
    const dx = s.tx - s.x, dy = s.ty - s.y, d = Math.hypot(dx, dy);
    if (d > 5) { s.x += dx / d * 20 * dt; s.y += dy / d * 20 * dt; s.flip = dx < 0; }
    s.woolT -= dt;
    if (s.woolT <= 0) {
      s.woolT = rand(16, 24);
      if (woolOnGround < 3) {
        drops.push({ type: 'wool', x: s.x + rand(-10, 10), y: s.y + 12, bob: Math.random() * TAU, taken: false });
        AU.baa();
      }
    }
  }

  /* --- pick up drops (magnet) --- */
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    if (started && !d.taken && dist(P.x, P.y, d.x, d.y) < 36) {
      if (freeSlots() >= 1) { d.taken = true; collectItem(d.type, d.x, d.y); drops.splice(i, 1); }
      else fullHint();
    }
  }

  /* --- flyers (items arcing to basket / sell stand) --- */
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i];
    f.t += dt / 0.45;
    if (f.mode === 'stack') {
      const tx = P.x - (P.flip ? -13 : 13), ty = P.y - 42 - Math.min(S.carried.length, 10) * 5;
      const t = Math.min(f.t, 1);
      f.x = lerp(f.sx, tx, t); f.y = lerp(f.sy, ty, t) - Math.sin(t * Math.PI) * 46;
      if (f.t >= 1) {
        flyers.splice(i, 1); reserved--;
        if (S.carried.length < cap()) S.carried.push(f.type);
        dirty = true;
      }
    } else if (f.mode === 'sell') {   // basket → market counter
      const t = Math.min(f.t, 1);
      f.x = lerp(f.sx, SELL_STAND.x - 10, t); f.y = lerp(f.sy, SELL_STAND.y - 40, t) - Math.sin(t * Math.PI) * 60;
      if (f.t >= 1) {
        flyers.splice(i, 1);
        S.counter[f.type] = (S.counter[f.type] || 0) + 1; dirty = true;
        S.soldOnce = true;
        puff(SELL_STAND.x - 10, SELL_STAND.y - 40, '#fff4d0', 2);
      }
    } else {   // 'buy' (counter → customer) and 'cash' (customer → money tile): purely visual
      const t = clamp(f.t, 0, 1);
      f.x = lerp(f.sx, f.tx, t); f.y = lerp(f.sy, f.ty, t) - Math.sin(t * Math.PI) * (f.mode === 'cash' ? 70 : 30);
      if (f.t >= 1) {
        flyers.splice(i, 1);
        if (f.mode === 'cash') puff(f.tx, f.ty, '#bff0b0', 3);
      }
    }
  }

  /* --- selling --- */
  if (started && S.carried.length > 0 && dist(P.x, P.y, SELL_ZONE.x, SELL_ZONE.y) < SELL_ZONE.r) {
    sellT += dt;
    if (sellT >= 0.11) {
      sellT = 0;
      const type = S.carried.pop();
      dirty = true;
      flyers.push({ type, mode: 'sell', t: 0, sx: P.x, sy: P.y - 40, x: P.x, y: P.y - 40 });
    }
  } else sellT = 0;

  /* --- market customers --- */
  updateCustomers(dt);

  /* --- collect cash from the money tile --- */
  if (started && S.pile > 0 && dist(P.x, P.y, CASH_ZONE.x, CASH_ZONE.y) < CASH_ZONE.r + 6) {
    cashT += dt;
    if (cashT >= 0.05) {
      cashT = 0;
      const chunk = Math.max(1, Math.ceil(S.pile / 8));
      S.pile -= chunk; S.coins += chunk; cashGain += chunk;
      S.cashOnce = true; dirty = true;
      coinParts.push({ sx: CASH_ZONE.x + rand(-12, 12), sy: CASH_ZONE.y - 10, x: CASH_ZONE.x, y: CASH_ZONE.y,
                       tx: P.x, ty: P.y - 50, t: 0 });
      if (time - lastCoinSnd > 0.08) { AU.coin(); lastCoinSnd = time; }
      bumpCoins();
      if (S.pile <= 0) { floater(P.x, P.y - 80, '+' + cashGain, '#b8ff8a', 24); cashGain = 0; save(); }
    }
  } else {
    cashT = 0;
    if (cashGain > 0) { floater(P.x, P.y - 80, '+' + cashGain, '#b8ff8a', 24); cashGain = 0; }
  }

  /* --- fishing at the dock --- */
  if (started && !P.moving && dist(P.x, P.y, FISH_SPOT.x, FISH_SPOT.y) < 46) {
    if (freeSlots() >= 1) {
      if (!fishing.active) {
        fishing.active = true; fishing.t = 0; fishing.biting = false; fishing.biteT = 0;
        fishing.bx = FISH_SPOT.x + rand(-6, 12); fishing.by = FISH_SPOT.y + 34 + rand(-4, 6);
        fishing.wait = rand(1.3, 3.0);
        AU.pop(0.7);
      }
      fishing.t += dt;
      if (!fishing.biting && fishing.t >= fishing.wait) {
        fishing.biting = true; fishing.biteT = 0;
        floater(fishing.bx, fishing.by - 22, '!', '#ffe08a', 24); AU.tick();
      }
      if (fishing.biting) {
        fishing.biteT += dt;
        if (fishing.biteT >= 0.55) {
          collectItem('fish', fishing.bx, fishing.by - 6);
          puff(fishing.bx, fishing.by, '#bfe6ff', 7);
          floater(fishing.bx, fishing.by - 18, '🐟', '#bfe6ff', 20);
          AU.splash();
          fishing.active = false;   // recast automatically while still standing here
        }
      }
    } else { fishing.active = false; fullHint(); }
  } else fishing.active = false;

  /* --- buy zones --- */
  for (const z of ZONES) {
    if (S.un[z.id] || !z.vis(S.un)) continue;
    if (!started) continue;
    if (dist(P.x, P.y, z.x, z.y) < z.r + 6 && S.coins > 0) {
      payT += dt;
      const rate = Math.max(10, z.cost / 3.2);
      const interval = 0.07;
      if (payT >= interval) {
        payT = 0;
        const paid = S.paid[z.id] || 0;
        const chunk = Math.min(Math.max(1, Math.round(rate * interval)), z.cost - paid, S.coins);
        if (chunk > 0) {
          S.coins -= chunk; S.paid[z.id] = paid + chunk; dirty = true;
          coinParts.push({ sx: P.x, sy: P.y - 40, x: P.x, y: P.y - 40, tx: z.x, ty: z.y, t: 0 });
          payTick = (payTick + 1) % 3;
          if (payTick === 0) AU.tick();
          if (S.paid[z.id] >= z.cost) unlock(z);
        }
      }
    }
  }
  for (let i = coinParts.length - 1; i >= 0; i--) {
    const c = coinParts[i];
    c.t += dt / 0.35;
    const t = Math.min(c.t, 1);
    c.x = lerp(c.sx, c.tx, t); c.y = lerp(c.sy, c.ty, t) - Math.sin(t * Math.PI) * 34;
    if (c.t >= 1) coinParts.splice(i, 1);
  }

  /* --- fx --- */
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i]; f.t += dt;
    if (f.t > 1.3) floaters.splice(i, 1);
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.rot += p.vr * dt;
    if (p.t > p.life) parts.splice(i, 1);
  }
  if (fullHintT > 0) fullHintT -= dt;

  /* --- ambient birds --- */
  ambientChirpT -= dt;
  if (ambientChirpT <= 0) { ambientChirpT = rand(6, 14); if (started) AU.chirp(); }

  /* --- autosave --- */
  saveT += dt;
  if (saveT > 2.5) { saveT = 0; if (dirty) save(); }

  refreshHud();
}
let sellT = 0, payT = 0, payTick = 0, lastCoinSnd = 0, cashT = 0, cashGain = 0, custSpawnT = 0;

function updateCustomers(dt) {
  const queue = customers.filter(c => !c.leaving);
  custSpawnT -= dt;
  if (queue.length < QUEUE_POS.length && custSpawnT <= 0) {
    custSpawnT = rand(0.9, 1.8);
    addCustomer(); queue.push(customers[customers.length - 1]);
    puff(CUSTOMER_GATE.x, CUSTOMER_GATE.y - 20, '#ffffff', 5);
  }
  queue.forEach((c, i) => { c.slot = i; });   // shuffle forward as the front one leaves
  for (let i = customers.length - 1; i >= 0; i--) {
    const c = customers[i];
    const tgt = c.leaving ? CUSTOMER_GATE : QUEUE_POS[c.slot];
    const dx = tgt.x - c.x, dy = tgt.y - c.y, d = Math.hypot(dx, dy);
    c.moving = d > 3;
    if (c.moving) {
      const sp = Math.min(d * 5, 95);
      c.x += dx / d * sp * dt; c.y += dy / d * sp * dt;
      if (Math.abs(dx) > 2) c.flip = dx < 0;
      c.walkPhase += dt * 11;
    } else { c.walkPhase = 0; if (!c.leaving) c.flip = true; }   // face the counter
    if (c.happyT > 0) c.happyT -= dt;
    if (c.leaving) {
      c.alpha = Math.min(c.alpha, clamp(d / 30, 0, 1));
      if (d < 4) { puff(c.x, c.y - 20, '#ffffff', 5); customers.splice(i, 1); }
      continue;
    }
    c.alpha = Math.min(1, c.alpha + dt * 3);
    if (!c.moving && !c.want) c.want = bestCounterType() || pick(['wheat', 'wood', 'egg']);
    if (c.slot !== 0 || c.moving) continue;
    // front of the queue: buy what's on the counter (switch wants if theirs ran out)
    if (!(S.counter[c.want] > 0)) c.want = bestCounterType() || c.want || pick(['wheat', 'wood', 'egg']);
    c.takeT += dt;
    if (c.takeT >= 0.24 && S.counter[c.want] > 0) {
      c.takeT = 0;
      const slot = counterSlots().find(s => s.type === c.want);
      const sx = slot ? slot.x : SELL_STAND.x, sy = slot ? slot.y - 10 : SELL_STAND.y - 40;
      if (--S.counter[c.want] <= 0) delete S.counter[c.want];
      const val = PRICES[c.want] || 1;
      S.pile += val; c.got++; dirty = true;
      flyers.push({ type: c.want, mode: 'buy', t: 0, sx, sy, x: sx, y: sy, tx: c.x, ty: c.y - 34 });

      }

    const y = r.y + r.h + 8 + rnd() * 18, s = 5 + rnd() * 6;

      for (const k of [-12.5, 0, 12.5]) {

  drawSky(night);

  // world transform
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale,
    dpr * (cssW / 2 - cam.x * scale), dpr * (cssH / 2 - cam.y * scale));

  // water sparkles
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  for (const s of sparkles) {
    const tw = (Math.sin(time * 1.6 + s.ph) + 1) / 2;
    if (tw < 0.5) continue;
    ctx.globalAlpha = (tw - 0.5) * 1.4 * (1 - night * 0.85);
    ctx.beginPath(); ctx.moveTo(s.x - 7, s.y); ctx.quadraticCurveTo(s.x, s.y - 3, s.x + 7, s.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // islands & flat ground
  drawShore(MAIN); drawShore(FOREST);
  if (!groundCanvas) bakeGround();
  ctx.drawImage(groundCanvas, 0, 0, WORLD.w, WORLD.h);
  drawDock();
  drawBridgeDeck(); drawGhostBridge();
  for (const pl of plots) drawPlot(pl);
  drawSellZone();
  drawCashTile();
  const visZones = ZONES.filter(z => !S.un[z.id] && z.vis(S.un) &&
    !(z.id === 'chick4' && !S.un.chick3) && !(z.id === 'chick3' && false));
  // hide chick4 until chick3 done, and don't show both at once
  const zonesToDraw = visZones.filter(z => !(z.id === 'chick4' && visZones.some(o => o.id === 'chick3')));
  for (const z of zonesToDraw) drawBuyZone(z);

  // y-sorted entities
  const drawables = [];
  drawables.push({ y: 252 + 6, draw: drawCoop });
  for (const t of trees) drawables.push({ y: t.y, draw: () => drawTree(t) });
  for (const b of bushes) drawables.push({ y: b.y, draw: () => drawBush(b) });
  for (const c of chickens) drawables.push({ y: c.y + 10, draw: () => drawChicken(c) });
  for (const c of cows) drawables.push({ y: c.y + 16, draw: () => drawCow(c) });
  for (const s of sheeps) drawables.push({ y: s.y + 14, draw: () => drawSheep(s) });
  for (const d of drops) drawables.push({ y: d.y, draw: () => drawDrop(d) });
  drawables.push({ y: SELL_STAND.y + 8, draw: drawStand });
  if (S.un.fountain) drawables.push({ y: FOUNTAIN.y + 16, draw: drawFountain });
  for (const f of chickenFence) drawables.push(f);
  if (S.un.cowpen) { if (!cowFence.length) cowFence = fencePieces(COW_PEN, { side: 'top', at: COW_PEN.x + COW_PEN.w / 2, w: 84 }); for (const f of cowFence) drawables.push(f); }
  if (S.un.sheep) { if (!sheepFence.length) sheepFence = fencePieces(SHEEP_PEN, { side: 'bottom', at: SHEEP_PEN.x + SHEEP_PEN.w / 2, w: 80 }); for (const f of sheepFence) drawables.push(f); }
  drawables.push({ y: S.player.y, draw: drawPlayer });
  drawables.push({ y: cat.y, draw: () => drawCat(cat) });
  for (const c of customers) drawables.push({ y: c.y, draw: () => drawCustomer(c) });
  drawables.push({ y: CUSTOMER_GATE.y - 14, draw: drawGate });
  drawables.push({ y: CASH_ZONE.y + 8, draw: drawCashStacks });
  drawables.sort((a, b) => a.y - b.y);
  for (const d of drawables) d.draw();
  drawFishing();
  for (const c of customers) drawCustomerBubble(c);

  // flyers above everything
  for (const f of flyers) {
    if (f.t < 0) continue;
    if (f.type === 'cash') drawBill(f.x, f.y, 1, Math.sin(f.t * 9) * 0.4);
    else drawItem(f.type, f.x, f.y, f.mode === 'buy' ? 0.9 : 1.1, f.t * 4);
  }
  // cash particles (paying into upgrades / scooping up the money tile)
  for (const c of coinParts) drawBill(c.x, c.y, 0.9, Math.sin(c.t * 8) * 0.5);
  // particles
  for (const p of parts) {
    ctx.save();
    ctx.globalAlpha = clamp(1 - p.t / p.life, 0, 1);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.col;
    ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.7);
    ctx.restore();
  }
  // buy-zone labels (never occluded)
  for (const z of zonesToDraw) drawBuyZoneLabel(z);
  // floaters
  for (const f of floaters) {
    const t = f.t / 1.3;
    ctx.save();
    ctx.globalAlpha = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;
    outlineText(f.txt, f.x, f.y - t * 44, f.size, f.col);
    ctx.restore();
  }
  // clouds float over the world
  for (const c of clouds) {
    c.x += c.v * 0.016;
    if (c.x > WORLD.w + 150) c.x = -150;
    drawCloud(c);
  }

  // ---- night overlay + cozy lantern light (screen space) ----
  if (night > 0.02) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.save();
    ctx.fillStyle = 'rgba(20,26,66,' + (night * 0.55).toFixed(3) + ')';
    ctx.fillRect(0, 0, cssW, cssH);
    ctx.globalCompositeOperation = 'lighter';
    const sc = cam.scale;
    const lamps = [
      { x: SELL_STAND.x, y: SELL_STAND.y - 42, r: 150 },
      { x: 178, y: 232, r: 130 },
      { x: S.player.x, y: S.player.y - 22, r: 120 },
      { x: CASH_ZONE.x, y: CASH_ZONE.y - 10, r: 90 },
    ];
    if (S.un.cowpen) lamps.push({ x: COW_PEN.x + COW_PEN.w / 2, y: COW_PEN.y + COW_PEN.h / 2, r: 130 });
    for (const L of lamps) {
      const sx = (L.x - cam.x) * sc + cssW / 2, sy = (L.y - cam.y) * sc + cssH / 2, r = L.r * sc;
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
      g.addColorStop(0, 'rgba(255,205,120,' + (0.5 * night).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,205,120,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  // screen-space: joystick
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (joy.active) {
    ctx.globalAlpha = 0.3;
    ctx.beginPath(); ctx.arc(joy.sx, joy.sy, 46, 0, TAU);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(joy.sx + joy.dx, joy.sy + joy.dy, 24, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* ---------------- boot ---------------- */
const overlay = document.getElementById('nameOverlay');
const nameInput = document.getElementById('nameInput');
const startBtn = document.getElementById('startBtn');
function beginGame(fresh) {
  started = true;
  elName.textContent = S.name + "'s Farm";
  elMute.textContent = AU.muted ? '🔇' : '🔊';
  overlay.classList.add('hidden');
  if (fresh) {
    floater(S.player.x, S.player.y - 80, 'Welcome, ' + S.name + '! 💛', '#fff', 22);
    save();
  }
}
startBtn.addEventListener('click', () => {
  AU.init();
  S.name = (nameInput.value || '').trim() || 'Farmer';
  AU.fanfare();
  beginGame(true);
});
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') startBtn.click(); });

const hasSave = load();
buildWorld();
if (hasSave) beginGame(false);
else overlay.classList.remove('hidden');

window.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
window.addEventListener('pagehide', () => save());

let last = performance.now(), sizeCheck = 0;
function frame(now) {
  requestAnimationFrame(frame);
  // Self-heal: iOS fires viewport changes inconsistently as its toolbars slide
  // away, so re-measure periodically. resize() early-returns when nothing moved.
  if (++sizeCheck % 15 === 0) resize();
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  render();
}
requestAnimationFrame(frame);
</script>
